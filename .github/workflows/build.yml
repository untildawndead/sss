name: Build Abyssal Reverb

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'

jobs:
  build-windows:
    name: Windows VST3 + Standalone
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target AbyssalReverb_VST3 --parallel --verbose

      - name: Build Standalone
        run: cmake --build build --config Release --target AbyssalReverb_Standalone --parallel --verbose

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $vst = Get-ChildItem -Path build -Directory -Recurse -Filter "Abyssal Reverb.vst3" | Select-Object -First 1
          if ($null -eq $vst) { throw "VST3 bundle was not found after build." }
          Compress-Archive -Path $vst.FullName -DestinationPath dist/AbyssalReverb-Windows-VST3.zip -Force
          $exe = Get-ChildItem -Path build -File -Recurse -Filter "Abyssal Reverb.exe" | Select-Object -First 1
          if ($null -ne $exe) { Copy-Item $exe.FullName dist/ }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: AbyssalReverb-Windows
          path: dist/*
          if-no-files-found: error

      - name: Upload CMake diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: AbyssalReverb-CMake-Diagnostics
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/**/*.log
          if-no-files-found: ignore
